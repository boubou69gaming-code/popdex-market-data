name: Update Market Prices

on:
  schedule:
    # Exécution automatique chaque lundi à 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch: # Permet de lancer manuellement la mise à jour en un clic depuis GitHub

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Actualiser les cotes du marché
        run: python scripts/update_market_prices.py

      - name: Commit et push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "chore(pricing): rafraîchissement automatique des cotes $(date +'%Y-%m-%d')" && git push)
